<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History | Medicine Delivery Robot</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">History workspace</p>
        <h1>Order History Tracking</h1>
      </div>
      <div class="header-actions">
        <span class="status-pill" id="serverStatus">Connecting</span>
        <button class="secondary" id="logoutButton" type="button">Logout</button>
      </div>
    </header>
    <nav class="app-nav" id="appNav"></nav>

    <main class="layout">
      <section class="panel tasks-panel map-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Audit trail</p>
            <h2>All delivery orders</h2>
          </div>
          <button id="refreshTasks" type="button">Refresh</button>
        </div>
        <div id="taskList" class="task-list history-list"></div>
      </section>
    </main>

    <template id="taskTemplate">
      <article class="task-card">
        <div class="task-topline">
          <strong data-field="patient"></strong>
          <span data-field="status" class="task-status"></span>
        </div>
        <div class="task-meta" data-field="meta"></div>
        <div class="task-medicine" data-field="medicine"></div>
        <ol data-field="route" class="route-list"></ol>
      </article>
    </template>
    <script src="/app.js"></script>
  </body>
</html>
